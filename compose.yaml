name: coding-agent-starter

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 2s
      timeout: 3s
      retries: 30

  customer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - customer-data:/var/lib/postgresql/data
      - ./customer-db/init.sql:/docker-entrypoint-initdb.d/001-catalog.sql:ro
    networks:
      - apps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer -d customer"]
      interval: 2s
      timeout: 3s
      retries: 30

  app-image:
    image: coding-agent-app:local
    build: ./app-template
    pull_policy: build
    command: ["true"]

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agent
      SPRING_DATASOURCE_USERNAME: agent
      SPRING_DATASOURCE_PASSWORD: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      customer-db:
        condition: service_healthy
      app-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  customer-data:

networks:
  apps:
    name: coding-agent-apps
