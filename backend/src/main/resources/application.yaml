spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/agent
    username: agent
    password: agent
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-4.1-mini}
  timeout: 5m
  memory-messages: 100
